
name: Update Blog Index

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "blog/posts/**"
      - "scripts/build-blog-index.py"
      - "blog/catalog-include.txt"
      - "blog/catalog-exclude.txt"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miaoon-blog-index
  cancel-in-progress: false

jobs:
  update-blog-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate blog directory
        run: python scripts/build-blog-index.py

      - name: Commit updated blog directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html
          if git diff --cached --quiet; then
            echo "Blog directory already up to date."
          else
            git commit -m "Auto-update Miaoon blog directory"
            git push
          fi
